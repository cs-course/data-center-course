<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="460px" height="190px" viewBox="-0.5 -0.5 460 190" content="&lt;mxfile&gt;&lt;diagram id=&quot;c-array-binarysearch&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title>折半查找在 7 个有序数中找 x=14</title>
