    <text x="65.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">2</text>
    <rect x="80" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="95.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">3</text>
    <rect x="110" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="125.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">4</text>
    <rect x="140" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="155.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">5</text>
    <rect x="170" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="185.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">6</text>
    <rect x="200" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="215.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">7</text>
    <rect x="230" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="245.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">8</text>
    <rect x="260" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="275.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">9</text>
    <rect x="290" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="305.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">10</text>
    <text x="35.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[0]</text>
    <text x="65.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[1]</text>
    <text x="95.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[2]</text>
    <text x="125.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[3]</text>
    <text x="155.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[4]</text>
    <text x="185.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[5]</text>
    <text x="215.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[6]</text>
    <text x="245.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[7]</text>
    <text x="275.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[8]</text>
    <text x="305.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a[9]</text>
    <rect x="320" y="84" width="30" height="34" fill="#F2F6FC" stroke="#D6E4F0" stroke-width="1" rx="2"/>
    <text x="335.0" y="130" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a+10</text>
    <rect x="16" y="48" width="40" height="24" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="36.0" y="60.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold">a</text>
    <path d="M 36 72 L 36 84" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ptr)"/>
    <rect x="66" y="48" width="40" height="24" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="86.0" y="60.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold">p</text>
    <path d="M 86 72 Q 62 52 45 84" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ptr)"/>
    <text x="14" y="150" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="bold">元素值</text>
    <rect x="14" y="156" width="96" height="30" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="62.0" y="171.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">a[i]</text>
    <text x="122" y="171" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">⇔</text>
    <rect x="134" y="156" width="96" height="30" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="182.0" y="171.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">*(a+i)</text>
    <text x="242" y="171" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">⇔</text>
    <rect x="254" y="156" width="96" height="30" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="302.0" y="171.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">*(p+i)</text>
    <text x="14" y="204" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="bold">元素地址</text>
    <rect x="14" y="210" width="96" height="30" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="62.0" y="225.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">&amp;a[i]</text>
    <text x="122" y="225" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">=</text>
    <rect x="134" y="210" width="96" height="30" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="182.0" y="225.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">a+i</text>
    <text x="242" y="225" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">=</text>
    <rect x="254" y="210" width="96" height="30" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="302.0" y="225.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">p+i</text>
    <rect x="12" y="250" width="336" height="24" fill="#F2F6FC" stroke="#D6E4F0" stroke-width="1" rx="4"/>
    <text x="180.0" y="262.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">下标写法与指针写法等价：a[i] ≡ *(a+i) ≡ *(p+i)</text>
  </g>
</svg>
