<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="360px" height="280px" viewBox="-0.5 -0.5 360 280" content="&lt;mxfile&gt;&lt;diagram id=&quot;c-pointer-to-array&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title>数组元素的三种等价表示</title>
  <desc>a[i] 与 *(a+i)、*(p+i) 等价；&amp;a[i]、a+i、p+i 是同一地址。数组名 a 是首地址，p=a 指向 a[0]。</desc>
  <defs>
    <marker id="ptr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <g>
    <text x="180" y="14" fill="#333333" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">① 数组元素的三种等价表示</text>
    <text x="180" y="34" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">int a[10],  *p = a;</text>
    <rect x="20" y="84" width="30" height="34" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="35.0" y="101.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">1</text>
