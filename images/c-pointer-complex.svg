<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="520px" height="130px" viewBox="-0.5 -0.5 520 130" content="&lt;mxfile&gt;&lt;diagram id=&quot;c-pointer-complex&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title>int (*p[2])(int); 声明拆解</title>
  <desc>由内向外读：p 是数组、有 2 个元素、元素是指针、指向函数、函数参数是 int、返回 int。</desc>
  <defs>
    <marker id="ptr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <g>
    <text x="260" y="12" fill="#333333" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">函数指针数组声明拆解（由内向外读）</text>
    <text x="260" y="34" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="bold">int (*p[2])(int);</text>
    <text x="54.0" y="50" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">①</text>
    <rect x="16" y="56" width="76" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="54.0" y="72.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">p 是数组</text>
    <text x="138.0" y="50" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">②</text>
    <rect x="100" y="56" width="76" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="72.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">2 个元素</text>
    <text x="222.0" y="50" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">③</text>
    <rect x="184" y="56" width="76" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="222.0" y="72.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">元素是指针</text>
    <text x="306.0" y="50" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">④</text>
    <rect x="268" y="56" width="76" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="306.0" y="72.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">指向函数</text>
    <text x="390.0" y="50" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">⑤</text>
    <rect x="352" y="56" width="76" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="390.0" y="72.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">参数 int</text>
    <text x="474.0" y="50" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">⑥</text>
    <rect x="436" y="56" width="76" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="474.0" y="72.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">返回 int</text>
    <rect x="12" y="96" width="496" height="26" fill="#F2F6FC" stroke="#D6E4F0" stroke-width="1" rx="4"/>
    <text x="260.0" y="109.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">p[2] 是数组，p[0]/p[1] 各指向一个 int (int) 函数（返回 int）</text>
