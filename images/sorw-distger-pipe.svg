<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="900" height="480" fill="#f7f9fc"/>
  <text x="450" y="42" font-size="24" font-weight="700" fill="#1a2b4a" text-anchor="middle">DistGER-Pipe：分布式二阶游走流水线 (TKDE'25)</text>

  <!-- pipeline stages -->
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="160" width="150" height="80" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
    <text x="115" y="195" font-size="16" font-weight="700" fill="#1a2b4a">图划分</text>
    <text x="115" y="218" font-size="13" fill="#5a6b85">分区 + 边割</text>

    <rect x="245" y="160" width="150" height="80" rx="12" fill="#e6f7f0" stroke="#2b9e8a" stroke-width="2"/>
    <text x="320" y="195" font-size="16" font-weight="700" fill="#1a2b4a">二阶采样</text>
    <text x="320" y="218" font-size="13" fill="#5a6b85">(t,vᵢ) 联合状态</text>

    <rect x="450" y="160" width="150" height="80" rx="12" fill="#fff3e0" stroke="#e08a2b" stroke-width="2"/>
    <text x="525" y="195" font-size="16" font-weight="700" fill="#7a4a10">I/O 优化层</text>
    <text x="525" y="218" font-size="13" fill="#9a6a2a">效益感知预取</text>

    <rect x="655" y="160" width="150" height="80" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
    <text x="730" y="195" font-size="16" font-weight="700" fill="#7a1f1f">嵌入训练</text>
    <text x="730" y="218" font-size="13" fill="#9a4a4a">Skip-gram + 聚合</text>

    <line x1="190" y1="200" x2="245" y2="200" stroke="#3a4a63" stroke-width="2.5" marker-end="url(#arr2)"/>
    <line x1="395" y1="200" x2="450" y2="200" stroke="#3a4a63" stroke-width="2.5" marker-end="url(#arr2)"/>
    <line x1="600" y1="200" x2="655" y2="200" stroke="#3a4a63" stroke-width="2.5" marker-end="url(#arr2)"/>
  </g>

  <!-- distributed workers -->
  <text x="450" y="300" font-size="15" fill="#1a2b4a" text-anchor="middle" font-weight="600">多机并行：每个分区独立采样，I/O 与计算流水线重叠</text>
  <g>
    <rect x="120" y="330" width="160" height="50" rx="10" fill="#ffffff" stroke="#9aaac4" stroke-width="1.5"/>
    <text x="200" y="361" font-size="14" fill="#1a2b4a" text-anchor="middle">Worker-1 (分区 A)</text>
    <rect x="370" y="330" width="160" height="50" rx="10" fill="#ffffff" stroke="#9aaac4" stroke-width="1.5"/>
    <text x="450" y="361" font-size="14" fill="#1a2b4a" text-anchor="middle">Worker-2 (分区 B)</text>
    <rect x="620" y="330" width="160" height="50" rx="10" fill="#ffffff" stroke="#9aaac4" stroke-width="1.5"/>
    <text x="700" y="361" font-size="14" fill="#1a2b4a" text-anchor="middle">Worker-k (分区 …)</text>
  </g>
  <text x="450" y="420" font-size="14" fill="#5a6b85" text-anchor="middle">全局嵌入表统一规约 → 支撑十亿级图上的二阶表示学习</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3a4a63"/>
    </marker>
  </defs>
</svg>
