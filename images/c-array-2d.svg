<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="300px" height="400px" viewBox="-0.5 -0.5 300 400" content="&lt;mxfile&gt;&lt;diagram id=&quot;c-array-2d&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title>二维数组在内存中的行优先排布</title>
  <desc>x[2][3] 六个元素按行连续存放，地址每次 +2B，右侧为对应下标</desc>
  <defs>
    <marker id="ptr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <g>
    <text x="150" y="20" fill="#333333" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">x[2][3] 在内存中按行优先连续存放</text>
    <text x="12" y="44" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="bold">地址</text>
    <text x="116" y="44" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="bold">值</text>
    <text x="184" y="44" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="bold">元素下标</text>
    <text x="141" y="56" fill="#BBBBBB" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">⋮</text>
    <text x="10" y="84.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central">0xffd0</text>
    <rect x="112" y="68" width="58" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="141.0" y="84.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">85</text>
    <text x="180" y="84.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" dominant-baseline="central">x[0][0]</text>
    <text x="10" y="118.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central">0xffd2</text>
    <rect x="112" y="102" width="58" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="141.0" y="118.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">91</text>
    <text x="180" y="118.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" dominant-baseline="central">x[0][1]</text>
    <text x="10" y="152.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central">0xffd4</text>
    <rect x="112" y="136" width="58" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="141.0" y="152.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">88</text>
    <text x="180" y="152.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" dominant-baseline="central">x[0][2]</text>
    <text x="10" y="186.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central">0xffd6</text>
    <rect x="112" y="170" width="58" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="141.0" y="186.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">82</text>
    <text x="180" y="186.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" dominant-baseline="central">x[1][0]</text>
    <text x="10" y="220.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central">0xffd8</text>
    <rect x="112" y="204" width="58" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="141.0" y="220.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">95</text>
    <text x="180" y="220.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" dominant-baseline="central">x[1][1]</text>
    <text x="10" y="254.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start" dominant-baseline="central">0xffda</text>
    <rect x="112" y="238" width="58" height="32" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="141.0" y="254.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold">88</text>
    <text x="180" y="254.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="start" dominant-baseline="central">x[1][2]</text>
    <path d="M 8 169.0 L 292 169.0" fill="none" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="242" y="118.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="bold">第 0 行</text>
    <text x="242" y="220.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="bold">第 1 行</text>
    <text x="141" y="282" fill="#BBBBBB" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">⋮</text>
    <text x="150" y="312" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">&amp;x[i][j] = 0xffd0 + (i*3 + j)*2</text>
    <rect x="10" y="344" width="280" height="28" fill="#F2F6FC" stroke="#D6E4F0" stroke-width="1" rx="4"/>
    <text x="150.0" y="358.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold">x[i][j] 行优先连续存放，地址步长为 2B</text>
  </g>
</svg>
