<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="268px" height="444px" viewBox="-0.5 -0.5 268 444" content="&lt;mxfile&gt;&lt;diagram id=&quot;c-pointer-sub-2026&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title>两个指针相减：下标之差与 strlen</title>
  <desc>上：pa1 指向 a[0]、pa2 指向 a[9]，下标相减得 9；下：q 指向串首、s 停在 '\0'，s − q 即字符串长度。</desc>
  <defs>
    <marker id="ptr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <g>
    <text x="134" y="18" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle" dominant-baseline="central">① 同一数组内的两个指针</text>
    <rect x="104" y="36" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <rect x="104" y="64" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <rect x="104" y="92" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="134.0" y="106.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" dominant-baseline="central">⋮</text>
    <rect x="104" y="120" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="174" y="50" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central">a[0]</text>
    <text x="174" y="78" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central">a[1]</text>
    <text x="174" y="134" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central">a[9]</text>
    <rect x="16" y="36" width="56" height="28" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="44.0" y="50.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle" dominant-baseline="central">pa1</text>
    <path d="M 72 50 L 101 50" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ptr)"/>
    <rect x="16" y="120" width="56" height="28" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="44.0" y="134.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle" dominant-baseline="central">pa2</text>
    <path d="M 72 134 L 101 134" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ptr)"/>
    <rect x="12" y="158" width="244" height="26" fill="#F2F6FC" stroke="#D6E4F0" stroke-width="1" rx="4"/>
    <text x="134" y="171" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle" dominant-baseline="central">pa2 − pa1 = 9 − 0 = 9  （下标之差）</text>
    <path d="M 12 196 L 256 196" fill="none" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="134" y="216" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle" dominant-baseline="central">② strlen 里的两个指针</text>
    <rect x="104" y="232" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="134.0" y="246.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" dominant-baseline="central">H</text>
    <rect x="104" y="260" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="134.0" y="274.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" dominant-baseline="central">e</text>
    <rect x="104" y="288" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="134.0" y="302.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" dominant-baseline="central">l</text>
    <rect x="104" y="316" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="134.0" y="330.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" dominant-baseline="central">l</text>
    <rect x="104" y="344" width="60" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="134.0" y="358.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle" dominant-baseline="central">o</text>
    <rect x="104" y="372" width="60" height="28" fill="#FFFF99" stroke="#000000" stroke-width="1"/>
    <text x="134.0" y="386.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" dominant-baseline="central">\0</text>
    <rect x="16" y="232" width="56" height="28" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="44.0" y="246.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle" dominant-baseline="central">q</text>
    <path d="M 72 246 L 101 246" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ptr)"/>
    <rect x="192" y="372" width="56" height="28" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1"/>
    <text x="220.0" y="386.0" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="middle" dominant-baseline="central">s</text>
    <path d="M 192 386 L 165 386" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ptr)"/>
    <rect x="12" y="412" width="244" height="26" fill="#F2F6FC" stroke="#D6E4F0" stroke-width="1" rx="4"/>
    <text x="134" y="425" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle" dominant-baseline="central">s − q = 5  （字符串长度）</text>
  </g>
</svg>
