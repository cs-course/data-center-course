<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="840" height="480" fill="#f7f9fc"/>
  <text x="420" y="42" font-size="26" font-weight="700" fill="#1a2b4a" text-anchor="middle">node2vec：二阶转移概率由「前驱 + 当前」联合状态决定</text>

  <!-- prev node t -->
  <rect x="70" y="150" width="130" height="70" rx="10" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="135" y="180" font-size="18" font-weight="700" fill="#1a2b4a" text-anchor="middle">前驱 t</text>
  <text x="135" y="204" font-size="13" fill="#5a6b85" text-anchor="middle">上一步所在</text>

  <!-- current node v_i -->
  <rect x="350" y="150" width="140" height="70" rx="10" fill="#fff3e0" stroke="#e08a2b" stroke-width="2"/>
  <text x="420" y="180" font-size="18" font-weight="700" fill="#7a4a10" text-anchor="middle">当前 v_i</text>
  <text x="420" y="204" font-size="13" fill="#9a6a2a" text-anchor="middle">正在决策下一步</text>

  <!-- walk edge t -> v_i -->
  <line x1="200" y1="185" x2="350" y2="185" stroke="#3a4a63" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="275" y="172" font-size="13" fill="#3a4a63" text-anchor="middle">已走的一步</text>

  <!-- candidates -->
  <rect x="640" y="80" width="150" height="60" rx="10" fill="#ffffff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="715" y="104" font-size="15" font-weight="700" fill="#1a2b4a" text-anchor="middle">候选 x = t</text>
  <text x="715" y="126" font-size="14" fill="#c0392b" text-anchor="middle">d=0 → 1/p</text>

  <rect x="640" y="200" width="150" height="60" rx="10" fill="#ffffff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="715" y="224" font-size="15" font-weight="700" fill="#1a2b4a" text-anchor="middle">候选 x∈N(t)</text>
  <text x="715" y="246" font-size="14" fill="#1f8a4c" text-anchor="middle">d=1 → 1</text>

  <rect x="640" y="320" width="150" height="60" rx="10" fill="#ffffff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="715" y="344" font-size="15" font-weight="700" fill="#1a2b4a" text-anchor="middle">候选 x∉N(t)∪{t}</text>
  <text x="715" y="366" font-size="14" fill="#c0392b" text-anchor="middle">d=2 → 1/q</text>

  <line x1="490" y1="185" x2="640" y2="110" stroke="#3b6fd4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="185" x2="640" y2="230" stroke="#3b6fd4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="185" x2="640" y2="350" stroke="#3b6fd4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- formula box -->
  <rect x="120" y="380" width="600" height="72" rx="10" fill="#1a2b4a" stroke="#1a2b4a" stroke-width="1"/>
  <text x="420" y="410" font-size="16" fill="#ffffff" text-anchor="middle">P(vᵢ₊₁=x | vᵢ, vᵢ₋₁) = π(vᵢ,x) / Σ π(vᵢ,y) ，  π(vᵢ,x) = αₚq(t,x) · w(vᵢ,x)</text>
  <text x="420" y="436" font-size="15" fill="#ffd98a" text-anchor="middle">p 小 → 偏向回头(BFS, 结构等价) ｜ q 小 → 偏向向外(DFS, 同质性)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b6fd4"/>
    </marker>
  </defs>
</svg>
