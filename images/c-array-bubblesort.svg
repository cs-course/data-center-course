<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="420px" height="430px" viewBox="-0.5 -0.5 420 430" content="&lt;mxfile&gt;&lt;diagram id=&quot;c-array-bubblesort&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title>冒泡排序三轮比较与交换</title>
