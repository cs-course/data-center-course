<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="300px" height="430px" viewBox="-0.5 -0.5 300 430" content="&lt;mxfile&gt;&lt;diagram id=&quot;c-pointer-concept-3&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title>指针运算符 *（执行中）</title>
  <desc>p=&amp;x 后，p 的 4 个字节存 BC FE 00 00（小端 0x0000FEBC，即 x 的首地址）；此刻 x=1、y=2，红弧线由 p 指向 x。</desc>
  <defs>
    <marker id="ptr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4 L 0 8 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <g>
    <text x="150" y="18" fill="#333333" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">④ 指针运算符 *：执行中</text>
    <text x="48" y="58.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central">0xFEBC</text>
    <text x="48" y="86.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central">0xFEBD</text>
    <text x="48" y="198.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central">0xFEC0</text>
    <text x="48" y="226.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central">0xFEC1</text>
    <text x="48" y="254.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central">0xFEC2</text>
    <text x="48" y="282.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central">0xFEC3</text>
    <text x="48" y="310.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central">0xFEC4</text>
    <rect x="100" y="44" width="76" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="58.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">1</text>
    <rect x="100" y="72" width="76" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="86.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">0</text>
    <rect x="100" y="100" width="76" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="114.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">2</text>
    <rect x="100" y="128" width="76" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="142.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">0</text>
    <rect x="100" y="156" width="76" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <rect x="100" y="184" width="76" height="28" fill="#FFFF99" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="198.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">BC</text>
    <rect x="100" y="212" width="76" height="28" fill="#FFFF99" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="226.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">FE</text>
    <rect x="100" y="240" width="76" height="28" fill="#FFFF99" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="254.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">00</text>
    <rect x="100" y="268" width="76" height="28" fill="#FFFF99" stroke="#000000" stroke-width="1"/>
    <text x="138.0" y="282.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central">00</text>
    <rect x="100" y="296" width="76" height="28" fill="#CCCCCC" stroke="#000000" stroke-width="1"/>
    <text x="204" y="58.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold">x</text>
    <text x="204" y="114.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold">y</text>
    <text x="204" y="198.0" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold">p</text>
    <path d="M 178.0 46.0 Q 186.0 46.0 186.0 54.0 L 186.0 65.0 Q 186.0 72.0 191.0 72.0 Q 186.0 72.0 186.0 79.0 L 186.0 90.0 Q 186.0 98.0 178.0 98.0" fill="none" stroke="#888888" stroke-width="1.3"/>
    <path d="M 178.0 102.0 Q 186.0 102.0 186.0 110.0 L 186.0 121.0 Q 186.0 128.0 191.0 128.0 Q 186.0 128.0 186.0 135.0 L 186.0 146.0 Q 186.0 154.0 178.0 154.0" fill="none" stroke="#888888" stroke-width="1.3"/>
    <path d="M 178.0 186.0 Q 186.0 186.0 186.0 194.0 L 186.0 233.0 Q 186.0 240.0 191.0 240.0 Q 186.0 240.0 186.0 247.0 L 186.0 286.0 Q 186.0 294.0 178.0 294.0" fill="none" stroke="#888888" stroke-width="1.3"/>
    <rect x="222" y="203.0" width="7" height="7" fill="#C0392B" stroke="#C0392B" stroke-width="1" rx="3"/>
    <path d="M 225 206 C 262 206 292 176 292 128 C 292 78 246 58 182 58" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ptr)"/>
    <text x="150" y="340" fill="#1A1A1A" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central">short x=1, y=2, *p;   p=&amp;x;</text>
    <text x="150" y="362" fill="#555555" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">y=*p;   *p+=10;</text>
    <rect x="8" y="384" width="284" height="28" fill="#F2F6FC" stroke="#D6E4F0" stroke-width="1" rx="4"/>
    <text x="150.0" y="398.0" fill="#1F3864" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">p 存的是 x 地址，*p 就是对 x 本身赋值</text>
  </g>
</svg>
